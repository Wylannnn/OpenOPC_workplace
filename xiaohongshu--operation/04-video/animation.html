<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1920px; background:#0A0A0F; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:-apple-system,sans-serif; position:relative;
}
#lineL { position:absolute; top:30%; left:0; height:2px; background:#00D4FF; opacity:0.4; }
#lineR { position:absolute; bottom:30%; right:0; height:2px; background:#7B2FFF; opacity:0.4; }
#logo {
  width:160px; height:160px; border-radius:40px;
  background:linear-gradient(135deg,#00D4FF,#7B2FFF);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:40px; box-shadow:0 0 24px rgba(0,212,255,0.35);
}
#logo span { font-size:56px; font-weight:900; color:#F0F0FF; }
#title { font-size:52px; font-weight:900; color:#F0F0FF; letter-spacing:4px; text-align:center; }
#sub { margin-top:16px; font-size:24px; font-weight:300; color:#8A8FA8; letter-spacing:8px; }
#dot { position:absolute; bottom:60px; width:8px; height:8px; border-radius:50%; background:#00D4FF; }
</style></head><body>
<div id="lineL"></div><div id="lineR"></div>
<div id="logo"><span>AI</span></div>
<div id="title">AI 商业观察</div>
<div id="sub">AI BUSINESS OBSERVER</div>
<div id="dot"></div>
<script>
var ___TOTAL = 90;
var ___FPS = 30;
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOutBack(t){ var c1=1.70158; var c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }

function seek(f) {
  var t = f / ___TOTAL;
  var lt = Math.min(1, f / (___FPS*0.5));
  document.getElementById('lineL').style.width = lerp(0,200,lt)+'px';
  var rt = Math.min(1, Math.max(0, (f-___FPS*0.5) / (___FPS*0.5)));
  document.getElementById('lineR').style.width = lerp(0,200,rt)+'px';
  var bt = Math.min(1, f / (___FPS*2.0));
  var bounceScale = easeOutBack(bt);
  var logo = document.getElementById('logo');
  logo.style.transform = 'scale('+bounceScale+') rotate('+lerp(0,360,bt)+'deg)';
  logo.style.opacity = lerp(0,1,Math.min(1,f/(___FPS*0.3)));
  var tt = Math.min(1, Math.max(0, (f-___FPS*1.5) / (___FPS*1.0)));
  var title = document.getElementById('title');
  title.style.opacity = easeOutCubic(tt);
  title.style.transform = 'translateY('+lerp(20,0,easeOutCubic(tt))+'px)';
  var st = Math.min(1, Math.max(0, (f-___FPS*2.2) / (___FPS*0.8)));
  document.getElementById('sub').style.opacity = easeOutCubic(st);
  var dt = Math.min(1, Math.max(0, (f-___FPS*2.5) / (___FPS*0.5)));
  document.getElementById('dot').style.opacity = lerp(0,0.6,dt);
}
seek(0);
</script>
</body></html>
